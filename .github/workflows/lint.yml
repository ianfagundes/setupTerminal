name: lint

on:
  push:
  pull_request:
  workflow_dispatch:   # permite rodar manualmente pelo botão na aba Actions

jobs:
  shell:
    name: Validação dos scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Sintaxe (bash -n)
        run: |
          bash -n install.sh
          bash -n dotfiles/git-cheat.sh

      - name: ShellCheck (boas práticas de shell)
        run: shellcheck install.sh dotfiles/git-cheat.sh

      - name: --help executa sem erro
        run: bash install.sh --help

      - name: Cheatsheet gera saída
        run: |
          out="$(bash dotfiles/git-cheat.sh stash)"
          echo "$out" | grep -q 'git stash' && echo "cola funciona ✓"
